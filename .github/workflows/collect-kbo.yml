name: KBO 경기 자동 수집

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 수집 범위
        required: true
        default: today
        type: choice
        options:
          - today
          - yesterday
          - upcoming
          - schedule
          - recent

permissions:
  contents: read

concurrency:
  group: kbo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: collector

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: KBO 향후 2개월 일정 수집
        if: inputs.mode == 'upcoming'
        run: npm run collect:schedule:upcoming
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: KBO 잔여 시즌 일정 수집
        if: inputs.mode == 'schedule'
        run: npm run collect:schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: KBO 당일 경기 상태 수집
        if: inputs.mode == 'today'
        run: npm run collect:today
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: KBO 전날 경기 최종 보정
        if: inputs.mode == 'yesterday'
        run: npm run collect:yesterday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: KBO 최근 경기 수동 수집
        if: inputs.mode == 'recent'
        run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
